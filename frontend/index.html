<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      页面级 CSP。样式里要带 'unsafe-inline'，因为 Vue 单文件组件的 <style> 是运行时插进去的；
      connect-src 里的 ws 是给开发服务器热更新用的。剩下的口子全关：
      object-src 'none' 挡插件类攻击，base-uri 'none' 挡 <base> 劫持相对地址。
      真正的接口响应还由后端再补一层更严的 CSP（/api 是 default-src 'none'）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
               img-src 'self' data:; font-src 'self' data:;
               connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173;
               object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>AI 漏洞播报系统</title>
    <!--
      图标走自带的 public 目录，不引 CDN。favicon 用简化版（icon-mini），
      小尺寸下细节才不会糊；apple-touch-icon 用同一张。
    -->
    <link rel="icon" type="image/svg+xml" href="/icon-mini.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="AI 赋能的漏洞播报系统：24 小时监控全网漏洞源，自动生成 PoC、漏洞原理与 nuclei 模板。" />
    <!-- GitHub 社交预览图 -->
    <meta property="og:title" content="AI 漏洞播报 · AI-Powered Vulnerability Intelligence Feed" />
    <meta property="og:description" content="24 小时监控全网漏洞源，LLM 内容判定后自动生成 PoC、漏洞原理与 nuclei 模板。" />
    <meta property="og:image" content="/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
