    <rect x="2" y="348" width="96" height="5" rx="2.5" fill="url(#blue)"/>

    <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" fill="#b8c0cf">
      <g transform="translate(2 404)">
        <circle cx="7" cy="-8" r="7" fill="#5aa7ff"/>
