<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AI 漏洞播报 — AI-Powered Vulnerability Intelligence Feed">
  <title>AI 漏洞播报 — AI-Powered Vulnerability Intelligence Feed</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="0.5" stop-color="#11151f"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="1" stop-color="#3d7dff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5aa7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#5aa7ff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#5aa7ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#5aa7ff" stop-opacity="0"/>
