    <circle cx="1120" cy="300" r="220"/>
    <circle cx="1120" cy="300" r="150"/>
    <circle cx="1120" cy="300" r="80"/>
  </g>
  <g transform="rotate(-18 1120 300)">
    <path d="M1120 300 L1120 10 A290 290 0 0 1 1359 123 Z" fill="url(#sweep)" opacity="0.7"/>
    <line x1="1120" y1="300" x2="1120" y2="10" stroke="#9ed0ff" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="1198" cy="150" r="8" fill="#f87171"/>
    <circle cx="1198" cy="150" r="15" fill="none" stroke="#f87171" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="1150" cy="545" r="5" fill="#fbbf24"/>
    <circle cx="1150" cy="545" r="11" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- 左侧标志（复用 icon 的护盾 + 神经网络） -->
  <g transform="translate(150 300)">
    <g transform="scale(0.52)">
      <g fill="none" stroke="#5aa7ff" stroke-opacity="0.22" stroke-width="5">
        <circle cx="0" cy="0" r="200"/>
        <circle cx="0" cy="0" r="150"/>
        <circle cx="0" cy="0" r="100"/>
      </g>
      <g transform="translate(0 -6)">
        <path d="M0 -104 L86 -68 V4 C86 58 50 92 0 112 C-50 92 -86 58 -86 4 V-68 Z"
