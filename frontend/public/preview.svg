      </g>
      <g transform="translate(2 452)">
        <circle cx="7" cy="-8" r="7" fill="#f472b6"/>
        <text x="30" y="0">LLM 内容判定：只收漏洞情报，赛事 WriteUp 一律不收</text>
      </g>
      <g transform="translate(2 500)">
        <circle cx="7" cy="-8" r="7" fill="#34d399"/>
        <text x="30" y="0">自动生成 PoC · 漏洞原理 · 攻击范围，并导出 nuclei 模板</text>
      </g>
    </g>

    <text x="2" y="566" font-family="Consolas, Menlo, monospace" font-size="23" fill="#5aa7ff">github.com/wr0x00/ai_bobao</text>
  </g>
</svg>
